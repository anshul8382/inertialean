<svg width="250" height="60" viewBox="0 0 250 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-text { font-family: 'Arial', sans-serif; font-weight: bold; }
      .logo-tagline { font-family: 'Times New Roman', serif; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="250" height="60" fill="#FFFFFF" rx="8"/>
  <rect width="250" height="60" fill="#000000" opacity="0.05" rx="8"/>
  
  <!-- Plant/Leaves Graphic -->
  <g transform="translate(15, 8)">
    <!-- Central green stem -->
    <path d="M15 45 Q20 25 25 10 Q25 5 30 10 Q25 15 25 20 Q20 35 15 45" 
          fill="#32CD32" stroke="#32CD32" stroke-width="2"/>
    
    <!-- Grey leaves around -->
    <path d="M25 20 Q35 15 40 25 Q35 30 30 35 Q25 30 25 25" 
          fill="#696969" stroke="#696969" stroke-width="1.5"/>
    
    <path d="M20 30 Q15 20 10 25 Q15 35 20 40 Q25 35 20 30" 
          fill="#696969" stroke="#696969" stroke-width="1.5"/>
    
    <path d="M30 35 Q40 40 45 35 Q40 25 35 20 Q30 25 30 35" 
          fill="#696969" stroke="#696969" stroke-width="1.5"/>
    
    <path d="M20 25 Q10 30 15 40 Q20 45 25 40 Q20 35 20 25" 
          fill="#696969" stroke="#696969" stroke-width="1.5"/>
    
    <!-- Circular boundary -->
    <circle cx="25" cy="30" r="20" fill="none" stroke="#696969" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- INERTIA Text -->
  <g transform="translate(65, 12)">
    <text x="0" y="25" class="logo-text" font-size="22" fill="#696969">IN</text>
    <text x="28" y="25" class="logo-text" font-size="22" fill="#32CD32">E</text>
    <text x="46" y="25" class="logo-text" font-size="22" fill="#32CD32">R</text>
    <text x="64" y="25" class="logo-text" font-size="22" fill="#696969">TIA</text>
  </g>
  
  <!-- Equities For Wealth Tagline -->
  <text x="65" y="42" class="logo-tagline" font-size="11" fill="#696969">Equities For Wealth</text>
</svg>

