{% extends "base.html" %}

{% block title %}Airflow UI{% endblock %}

{% block content %}
<div class="container-fluid" style="height: calc(100vh - 100px); padding: 0;">
    <div class="d-flex justify-content-between align-items-center mb-2 p-3 bg-light border-bottom">
        <h4 class="mb-0">
            <i class="fas fa-project-diagram"></i> Airflow UI
        </h4>
        <div>
            <a href="/airflow/dashboard" class="btn btn-sm btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
            <a href="http://localhost:8080" target="_blank" class="btn btn-sm btn-info">
                <i class="fas fa-external-link-alt"></i> Open in New Tab
            </a>
        </div>
    </div>
    <iframe 
        src="{{ airflow_proxy_url }}" 
        style="width: 100%; height: calc(100vh - 150px); border: none;"
        frameborder="0"
        title="Airflow UI">
    </iframe>
</div>

<script>
// Handle iframe navigation
window.addEventListener('message', function(event) {
    // Handle messages from iframe if needed
});

// Auto-resize iframe (if needed)
function resizeIframe() {
    const iframe = document.querySelector('iframe');
    if (iframe) {
        iframe.style.height = (window.innerHeight - 150) + 'px';
    }
}

window.addEventListener('resize', resizeIframe);
resizeIframe();
</script>
{% endblock %}
