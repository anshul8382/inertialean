{% extends "base.html" %}

{% block title %}Edit Lead{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800">Edit Lead</h1>
        <div>
            <a href="{{ url_for('leads.view_lead', lead_id=lead.id) }}" class="btn btn-info">
                <i class="fas fa-eye"></i> View Lead
            </a>
            <a href="{{ url_for('leads.list_leads') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Leads
            </a>
        </div>
    </div>

    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Lead Information</h6>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('leads.edit_lead', lead_id=lead.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ lead.name }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ lead.email }}">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="phone">Phone *</label>
                            <input type="tel" class="form-control" id="phone" name="phone" value="{{ lead.phone }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="source">Source</label>
                            <select class="form-control" id="source" name="source">
                                {% for value, label in source_choices %}
                                <option value="{{ value }}" {% if lead.source == value %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="referral_by">Referral By</label>
                            <input type="text" class="form-control" id="referral_by" name="referral_by" value="{{ lead.referral_by }}" placeholder="Name of person who gave referral">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select class="form-control" id="status" name="status">
                                {% for value, label in lead_status_choices %}
                                  {% if '(legacy)' not in label or lead.status == value %}
                                <option value="{{ value }}" {% if lead.status == value %}selected{% endif %}>{{ label }}</option>
                                  {% endif %}
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <div class="form-check">
                                <input type="hidden" name="is_active" value="0">
                                <input type="checkbox" class="form-check-input" id="is_active" name="is_active" value="1" {% if lead.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="is_active">
                                    Active Lead
                                </label>
                            </div>
                            <small class="form-text text-muted">Uncheck to deactivate this lead</small>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label>Notes</label>
                            <div class="alert alert-info">
                                <i class="fas fa-info-circle"></i>
                                Notes are now managed through the Notes Log on the lead detail page.
                                <br><a href="{{ url_for('leads.view_lead', lead_id=lead.id) }}" class="alert-link">View lead details to add notes</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
