{% extends "base.html" %}

{% block title %}Edit Meeting{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Edit Meeting</h2>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ meeting.title }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ meeting.description }}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="meeting_date" class="form-label">Date and Time</label>
                                    <input type="datetime-local" class="form-control" id="meeting_date" name="meeting_date" 
                                           value="{{ meeting.meeting_date.strftime('%Y-%m-%dT%H:%M') }}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="duration" class="form-label">Duration (minutes)</label>
                                    <input type="number" class="form-control" id="duration" name="duration" 
                                           min="15" step="15" value="{{ meeting.duration or 60 }}" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="scheduled" {% if meeting.status == 'scheduled' %}selected{% endif %}>Scheduled</option>
                                <option value="completed" {% if meeting.status == 'completed' %}selected{% endif %}>Completed</option>
                                <option value="cancelled" {% if meeting.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3">{{ meeting.notes }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="participant_ids" class="form-label">Team participants</label>
                            <select class="form-select" id="participant_ids" name="participant_ids" multiple size="8" aria-describedby="participantHelp">
                                {% for u in team_users %}
                                <option value="{{ u.id }}" {% if u.id in selected_participant_ids %}selected{% endif %}>{{ u.username }}{% if u.email %} — {{ u.email }}{% endif %}</option>
                                {% endfor %}
                            </select>
                            <div id="participantHelp" class="form-text">Hold Ctrl (Windows) or ⌘ (Mac) to select multiple. They appear in the app and get Google Calendar invites when sync is enabled.</div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('meetings.view_meeting', id=meeting.id) }}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Meeting</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
