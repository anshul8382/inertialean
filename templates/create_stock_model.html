{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Create Stock Allocation Model</h2>
        <a href="{{ url_for('main.models') }}" class="btn btn-secondary">Back to Models</a>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Model Details</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group mb-3">
                    <label for="name">Model Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="form-group mb-3">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                </div>

                <h5 class="mt-4 mb-3">Stock Allocations</h5>
                <div id="stock-allocations">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <select class="form-control stock-select" name="stock_id[]" required>
                                <option value="">Select Stock</option>
                                {% for stock in stocks %}
                                <option value="{{ stock.id }}">{{ stock.symbol }} - {{ stock.company_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <input type="number" class="form-control allocation-input" name="allocation_percentage[]" 
                                   placeholder="Allocation %" min="0" max="100" step="0.01" required>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-danger remove-stock">Remove</button>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="button" class="btn btn-secondary" id="add-stock">Add Stock</button>
                    <button type="submit" class="btn btn-primary">Create Model</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const stockAllocations = document.getElementById('stock-allocations');
    const addStockBtn = document.getElementById('add-stock');
    let totalAllocation = 0;

    // Function to update total allocation
    function updateTotalAllocation() {
        totalAllocation = 0;
        document.querySelectorAll('.allocation-input').forEach(input => {
            totalAllocation += parseFloat(input.value || 0);
        });
        
        // Update validation message
        const validationMsg = document.getElementById('allocation-validation');
        if (validationMsg) {
            validationMsg.textContent = `Total Allocation: ${totalAllocation.toFixed(2)}%`;
            validationMsg.className = Math.abs(totalAllocation - 100) < 0.01 ? 'text-success' : 'text-danger';
        }
    }

    // Add stock row
    addStockBtn.addEventListener('click', function() {
        const newRow = document.createElement('div');
        newRow.className = 'row mb-3';
        newRow.innerHTML = `
            <div class="col-md-6">
                <select class="form-control stock-select" name="stock_id[]" required>
                    <option value="">Select Stock</option>
                    {% for stock in stocks %}
                    <option value="{{ stock.id }}">{{ stock.symbol }} - {{ stock.company_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <input type="number" class="form-control allocation-input" name="allocation_percentage[]" 
                       placeholder="Allocation %" min="0" max="100" step="0.01" required>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-danger remove-stock">Remove</button>
            </div>
        `;
        stockAllocations.appendChild(newRow);
        
        // Add event listener to new allocation input
        newRow.querySelector('.allocation-input').addEventListener('input', updateTotalAllocation);
    });

    // Remove stock row
    stockAllocations.addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-stock')) {
            e.target.closest('.row').remove();
            updateTotalAllocation();
        }
    });

    // Add event listeners to initial allocation inputs
    document.querySelectorAll('.allocation-input').forEach(input => {
        input.addEventListener('input', updateTotalAllocation);
    });

    // Form validation
    document.querySelector('form').addEventListener('submit', function(e) {
        if (Math.abs(totalAllocation - 100) > 0.01) {
            e.preventDefault();
            alert('Total allocation must equal 100%');
        }
    });
});
</script>
{% endblock %}
