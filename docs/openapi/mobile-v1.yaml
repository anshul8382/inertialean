openapi: 3.0.3
info:
  title: Inertia Mobile API (v1 subset)
  description: |
    JSON API consumed by apps/mobile (Expo). Full v1 surface is larger;
  version: 1.0.0
  contact:
    name: Inertia Engineering

servers:
  - url: /api/v1
    description: Relative to app host (e.g. https://app.example.com/api/v1)

paths:
  /health:
    get:
      summary: Liveness probe
      tags: [Ops]
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /health/ready:
    get:
      summary: Readiness probe (DB + config)
      tags: [Ops]
      security: []
      responses:
        "200":
          description: Ready
        "503":
          description: Degraded (e.g. DB unreachable)

  /auth/login:
    post:
      summary: Login (email + password)
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: JWT issued or 2FA required
        "401":
          description: Invalid credentials

  /auth/verify-2fa:
    post:
      summary: Complete login with TOTP
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: JWT issued

  /auth/me:
    get:
      summary: Current user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile

  /clients/:
    get:
      summary: List clients (advisor-scoped)
      tags: [Clients]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Client list

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
        timestamp:
          type: string
          format: date-time
        version:
          type: string

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error_code:
          type: string
        trace_id:
          type: string
