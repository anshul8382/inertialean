# Apache Virtual Host Configuration for inertiainvest.in - CentOS/RHEL Version
# Place this file in /etc/httpd/conf.d/

<VirtualHost *:80>
    ServerName inertiainvest.in
    ServerAlias www.inertiainvest.in
    DocumentRoot /home/inertia/app
    
    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName inertiainvest.in
    ServerAlias www.inertiainvest.in
    DocumentRoot /home/inertia/app
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/inertiainvest.in.crt
    SSLCertificateKeyFile /etc/ssl/private/inertiainvest.in.key
    SSLCertificateChainFile /etc/ssl/certs/inertiainvest.in.chain.crt
    
    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # WSGI Configuration
    WSGIDaemonProcess inertia_app python-home=/home/inertia/app/venv python-path=/home/inertia/app
    WSGIProcessGroup inertia_app
    WSGIScriptAlias / /home/inertia/app/wsgi.py
    
    # Static files
    Alias /static /home/inertia/app/static
    <Directory /home/inertia/app/static>
        Require all granted
        ExpiresActive On
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
    </Directory>
    
    # Uploads directory
    Alias /uploads /home/inertia/app/uploads
    <Directory /home/inertia/app/uploads>
        Require all granted
    </Directory>
    
    # Application directory
    <Directory /home/inertia/app>
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>
    
    # Logging
    ErrorLog /var/log/httpd/inertiainvest.in_error.log
    CustomLog /var/log/httpd/inertiainvest.in_access.log combined
    
    # Security
    ServerTokens Prod
    ServerSignature Off
</VirtualHost>
