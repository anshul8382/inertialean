# Apache — production cutover: https://inertiainvest.in → Gunicorn v2026 (127.0.0.1:5004)
#
# Install (CentOS/RHEL httpd):
#   sudo cp config/apache-inertiainvest-prod-v2026-proxy.conf /etc/httpd/conf.d/inertiainvest-prod-v2026.conf
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# Prereqs: a2enmod proxy proxy_http headers rewrite ssl  (or httpd equivalents)
# Service: inertia-2026v1 on 127.0.0.1:5004 — see config/inertia-2026v1.service
#
# After cutover: disable legacy inertia-app (port 5000) and close public port 5003.

<VirtualHost *:80>
    ServerName inertiainvest.in
    ServerAlias www.inertiainvest.in
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName inertiainvest.in
    ServerAlias www.inertiainvest.in

    # --- Adjust if app root differs on server ---
    Define INERTIA_APP_ROOT /opt/Inertia2026v1
    Define INERTIA_GUNICORN_UPSTREAM http://127.0.0.1:5004

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/inertiainvest.in.crt
    SSLCertificateKeyFile /etc/ssl/private/inertiainvest.in.key
    SSLCertificateChainFile /etc/ssl/certs/inertiainvest.in.chain.crt

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyPreserveHost On
    ProxyPass / ${INERTIA_GUNICORN_UPSTREAM}/
    ProxyPassReverse / ${INERTIA_GUNICORN_UPSTREAM}/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyTimeout 300

    Alias /static ${INERTIA_APP_ROOT}/static
    <Directory ${INERTIA_APP_ROOT}/static>
        Require all granted
        ExpiresActive On
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
    </Directory>

    # Staff-only lockdown on public hostname (enable_private_access_tailscale.sh).
    IncludeOptional /etc/httpd/inertia/inertiainvest-public-lockdown.conf

    ErrorLog /var/log/httpd/inertiainvest.in_error.log
    CustomLog /var/log/httpd/inertiainvest.in_access.log combined
</VirtualHost>
