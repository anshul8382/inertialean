# cPanel userdata — proxy_flask.conf for inertiainvest.in → v2026 Gunicorn :5004
# cPanel expects RewriteRule [P], not bare ProxyPass (see config/apache-finvantage.conf).
# /web and /finvantage exclusions live in separate userdata files (load first via [L]).

RewriteEngine On
RewriteCond %{REQUEST_URI} !^/web(/|$) [NC]
RewriteCond %{REQUEST_URI} !^/finvantage(/|$) [NC]
RewriteRule ^/(.*)$ http://127.0.0.1:5004/$1 [P,L]
ProxyPassReverse / http://127.0.0.1:5004/
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"
