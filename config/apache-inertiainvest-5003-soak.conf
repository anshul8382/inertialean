# Soak-test SSL on port 5003 → Gunicorn 127.0.0.1:5004
# Disable or remove after production cutover to :443 (close public 5003 in firewall).
#
# Install:
#   sudo cp config/apache-inertiainvest-5003-soak.conf /etc/httpd/conf.d/inertia2026v1-5003-ssl.conf

Listen 5003

<VirtualHost *:5003>
    ServerName inertiainvest.in

    Define INERTIA_GUNICORN_UPSTREAM http://127.0.0.1:5004

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/inertiainvest.in.crt
    SSLCertificateKeyFile /etc/ssl/private/inertiainvest.in.key
    SSLCertificateChainFile /etc/ssl/certs/inertiainvest.in.chain.crt

    ProxyPreserveHost On
    ProxyPass / ${INERTIA_GUNICORN_UPSTREAM}/
    ProxyPassReverse / ${INERTIA_GUNICORN_UPSTREAM}/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "5003"
    ProxyTimeout 300

    ErrorLog /var/log/httpd/inertia2026v1-5003_error.log
    CustomLog /var/log/httpd/inertia2026v1-5003_access.log combined
</VirtualHost>
