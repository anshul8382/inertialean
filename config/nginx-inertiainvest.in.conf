# Nginx Configuration for inertiainvest.in
# Place this file in /etc/nginx/sites-available/ and create a symlink in sites-enabled

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name inertiainvest.in www.inertiainvest.in;
    return 301 https://$server_name$request_uri;
}

# HTTPS Configuration
server {
    listen 443 ssl http2;
    server_name inertiainvest.in www.inertiainvest.in;
    
    # SSL Configuration
    ssl_certificate /etc/ssl/certs/inertiainvest.in.crt;
    ssl_certificate_key /etc/ssl/private/inertiainvest.in.key;
    ssl_trusted_certificate /etc/ssl/certs/inertiainvest.in.chain.crt;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Root directory
    root /home/inertia/app;
    
    # Static files
    location /static/ {
        alias /home/inertia/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Uploads
    location /uploads/ {
        alias /home/inertia/app/uploads/;
        expires 1d;
    }
    
    # FinVantage SPA (Indian Adaptive Wealth Planner)
    location /finvantage/ {
        alias /home/inertia/fp/dist-app/;
        index index.html;
        try_files $uri $uri/ /finvantage/index.html;
        expires -1;
    }
    location = /finvantage {
        return 301 /finvantage/;
    }
    
    # Insurance Recommendation & Quote Engine
    location /insurance/ {
        alias /home/inertia/public_html/insurance/;
        index index.html;
        try_files $uri $uri/ /insurance/index.html;
        expires -1;
    }
    location = /insurance {
        return 301 /insurance/;
    }
    
    # Inertia RIA Marketing Website (SEBI disclosures, About, Services)
    location /web/ {
        alias /home/inertia/inertia-website/dist/;
        index index.html;
        try_files $uri $uri/ /web/index.html;
        expires -1;
    }
    location = /web {
        return 301 /web/;
    }
    
    # Financial Planner (port 8000 backend)
    location /financialplanning/api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location /financialplanning/ {
        alias /home/inertia/financial planning/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /financialplanning/index.html;
        expires -1;
    }
    location = /financialplanning {
        return 301 /financialplanning/;
    }
    
    # Gunicorn/WSGI
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts — main app (Claude-backed reports can take several minutes)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Logging
    access_log /var/log/nginx/inertiainvest.in_access.log;
    error_log /var/log/nginx/inertiainvest.in_error.log;
}
