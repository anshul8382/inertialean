# Inertia RIA Marketing Website - Apache config for cPanel
# Copy to:
#   /etc/apache2/conf.d/userdata/ssl/2_4/inertia/inertiainvest.in/web.conf
#   /etc/apache2/conf.d/userdata/std/2_4/inertia/inertiainvest.in/web.conf
# Then: /usr/local/cpanel/scripts/rebuildhttpdconf && systemctl restart httpd

# Exclude /web from proxy - serve static files directly
RewriteEngine On
RewriteCond %{REQUEST_URI} ^/web [OR]
RewriteCond %{REQUEST_URI} ^/web/
RewriteRule ^ - [L]

# Serve Inertia RIA website at /web
Alias /web/ /home/inertia/public_html/web/
<Directory /home/inertia/public_html/web>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    FallbackResource /web/index.html
</Directory>
