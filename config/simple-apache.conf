# Simple Apache configuration for Flask app
# Place this in /etc/httpd/conf.d/flask-app.conf

<VirtualHost *:80>
    ServerName inertiainvest.in
    ServerAlias www.inertiainvest.in
    
    # WSGI Configuration
    WSGIDaemonProcess flaskapp python-home=/home/inertia/app/venv python-path=/home/inertia/app
    WSGIProcessGroup flaskapp
    WSGIScriptAlias / /home/inertia/app/wsgi.py
    
    # Static files
    Alias /static /home/inertia/app/static
    <Directory /home/inertia/app/static>
        Require all granted
    </Directory>
    
    # Application directory
    <Directory /home/inertia/app>
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>
    
    # Logging
    ErrorLog /var/log/httpd/flask-app_error.log
    CustomLog /var/log/httpd/flask-app_access.log combined
</VirtualHost>
