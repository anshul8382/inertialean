<VirtualHost *:80>
    ServerName inertiainvest.in
    ServerAlias www.inertiainvest.in
    
    # Disable default document root
    DocumentRoot /dev/null
    
    # Proxy all requests to your Flask app running on port 5000
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    
    # Optional: Log requests (using cPanel log directory)
    ErrorLog /usr/local/apache/logs/inertiainvest.in_error.log
    CustomLog /usr/local/apache/logs/inertiainvest.in_access.log combined
</VirtualHost>
