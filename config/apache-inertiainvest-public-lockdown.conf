# Block login/UI on the PUBLIC hostname (https://inertiainvest.in).
# Staff use Tailscale Serve URL (*.ts.net) on approved devices; office PCs use the same.
# WhatsApp stays public on hooks.inertiainvest.in (separate vhost).
#
# Installed by: scripts/deployment/enable_private_access_tailscale.sh
# Remove to restore public access: sudo rm /etc/httpd/inertia/inertiainvest-public-lockdown.conf

<IfModule mod_authz_core.c>
    <Location "/">
        Require all denied
    </Location>
</IfModule>
