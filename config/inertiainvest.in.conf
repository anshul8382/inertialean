# Apache Virtual Host Configuration for inertiainvest.in
# Domain proxies to the same app process as http://66.116.199.231:5000
# Place this file in /etc/apache2/sites-available/ and enable it
# Required: a2enmod proxy proxy_http headers rewrite ssl

<VirtualHost *:80>
    ServerName inertiainvest.in
    ServerAlias www.inertiainvest.in
    DocumentRoot /home/inertia/app
    
    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName inertiainvest.in
    ServerAlias www.inertiainvest.in
    DocumentRoot /home/inertia/app
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/inertiainvest.in.crt
    SSLCertificateKeyFile /etc/ssl/private/inertiainvest.in.key
    SSLCertificateChainFile /etc/ssl/certs/inertiainvest.in.chain.crt
    
    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Proxy to same process as port 5000 (Gunicorn / python run.py)
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    
    # Timeouts — hybrid portfolio review (Claude) can exceed 60s; short values yield 502 HTML from Apache
    ProxyTimeout 300
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/inertiainvest.in_error.log
    CustomLog ${APACHE_LOG_DIR}/inertiainvest.in_access.log combined
    
    # Security
    ServerTokens Prod
    ServerSignature Off
</VirtualHost>
