# FinVantage SPA - Apache config for cPanel
# Copy to:
#   /etc/apache2/conf.d/userdata/ssl/2_4/inertia/inertiainvest.in/finvantage.conf
#   /etc/apache2/conf.d/userdata/std/2_4/inertia/inertiainvest.in/finvantage.conf
# Then: /usr/local/cpanel/scripts/rebuildhttpdconf && systemctl restart httpd

# Exclude /finvantage from proxy (proxy_flask uses RewriteRule, not ProxyPass)
RewriteEngine On
RewriteCond %{REQUEST_URI} ^/finvantage [OR]
RewriteCond %{REQUEST_URI} ^/finvantage/
RewriteRule ^ - [L]

# Serve FinVantage static files at /finvantage
Alias /finvantage /home/inertia/fp/dist-app
<Directory /home/inertia/fp/dist-app>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    FallbackResource /finvantage/index.html
</Directory>
