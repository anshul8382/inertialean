# cPanel userdata — force :443 (and std) to v2026 Gunicorn.
# Installed as zzz_v2026_gunicorn.conf so it loads after proxy_flask.conf.
# Paths (both if present):
#   /etc/apache2/conf.d/userdata/ssl/2_4/inertia/inertiainvest.in/zzz_v2026_gunicorn.conf
#   /etc/apache2/conf.d/userdata/std/2_4/inertia/inertiainvest.in/zzz_v2026_gunicorn.conf
# Then: /usr/local/cpanel/scripts/rebuildhttpdconf && systemctl reload httpd

ProxyPreserveHost On
ProxyPass / http://127.0.0.1:5004/
ProxyPassReverse / http://127.0.0.1:5004/
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"
ProxyTimeout 300
