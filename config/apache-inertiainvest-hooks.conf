# Public webhook-only vhost (optional) — keeps Meta WhatsApp reachable when main site is Tailscale-only.
#
# 1. DNS: hooks.inertiainvest.in → server public IP
# 2. SSL cert for hooks.inertiainvest.in (or wildcard *.inertiainvest.in)
# 3. Meta webhook URL: https://hooks.inertiainvest.in/api/v1/whatsapp/webhook
# 4. Update .env WHATSAPP_WEBHOOK_URL on the app host
#
# Install:
#   sudo cp config/apache-inertiainvest-hooks.conf /etc/httpd/conf.d/inertiainvest-hooks.conf
#   sudo apachectl configtest && sudo systemctl reload httpd

<VirtualHost *:80>
    ServerName hooks.inertiainvest.in
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName hooks.inertiainvest.in

    Define INERTIA_GUNICORN_UPSTREAM http://127.0.0.1:5004

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/inertiainvest.in.crt
    SSLCertificateKeyFile /etc/ssl/private/inertiainvest.in.key
    SSLCertificateChainFile /etc/ssl/certs/inertiainvest.in.chain.crt

    # WhatsApp verification + events (signature checked in app)
    ProxyPreserveHost On
    ProxyPass /api/v1/whatsapp/webhook ${INERTIA_GUNICORN_UPSTREAM}/api/v1/whatsapp/webhook
    ProxyPassReverse /api/v1/whatsapp/webhook ${INERTIA_GUNICORN_UPSTREAM}/api/v1/whatsapp/webhook
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 120

    # Deny everything else on this hostname
    <Location "/">
        Require all denied
    </Location>
    <Location "/api/v1/whatsapp/webhook">
        Require all granted
    </Location>

    ErrorLog /var/log/httpd/inertiainvest-hooks_error.log
    CustomLog /var/log/httpd/inertiainvest-hooks_access.log combined
</VirtualHost>
